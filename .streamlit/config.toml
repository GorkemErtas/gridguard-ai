# Adapted from the financial dashboard theme; local system fonts keep offline use self-contained.
[theme]
base = "dark"
primaryColor = "#0E7490"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#142033"
textColor = "#E2E8F0"
linkColor = "#38BDF8"
borderColor = "#29394F"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2.25rem", "1.6rem", "1.15rem"]
chartCategoricalColors = ["#38BDF8", "#2DD4BF", "#FBBF24", "#FB7185", "#A78BFA"]
dataframeHeaderBackgroundColor = "#1B2C43"
dataframeHeaderTextColor = "#F1F5F9"
[theme.sidebar]
backgroundColor = "#101A2B"
secondaryBackgroundColor = "#1B2C43"
