name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[app,dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Smoke test synthetic demo
        run: |
          gridguard demo --customers 120 --days 90
          test -f artifacts/metrics.json
          test -f artifacts/test_predictions.csv
          gridguard experiment --input data/demo.csv --source synthetic --output-dir artifacts/synthetic-validation
          gridguard finalize --input data/demo.csv --experiment-dir artifacts/synthetic-validation --output-dir artifacts/synthetic-final
          python scripts/evaluate_holdout.py --artifacts artifacts/synthetic-final --output-dir reports/synthetic-final --bootstrap 20
          test -f reports/synthetic-final/error_analysis.json
